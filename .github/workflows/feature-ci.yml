name: FoodieHub Feature CI

on:
  push:
    branches:
      - feature/delivery-tracking-google-map

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodiehub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax check
        run: python -m py_compile backend/restaurant/models.py backend/restaurant/views.py backend/restaurant/urls.py backend/config/settings.py
      - name: Django system check
        working-directory: backend
        env:
          MYSQL_DATABASE: foodiehub
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test restaurant.tests
      - name: JavaScript syntax check
        run: |
          node --check frontend/js/google_auth.js
          node --check frontend/js/checkout_map.js
          node --check frontend/js/cart_script.js
          node --check frontend/js/menu_dynamic.js
          node --check frontend/js/restaurant_details_dynamic.js
          node --check frontend/delivery_portal/delivery_auth.js
          node --check frontend/delivery_portal/portal.js
          node --check frontend/user_portal/portal.js
