<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoodieHub Payment</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root {
  --orange: #ff6b00;
  --light: #fff3eb;
}

body {
  background: #f5f6f8;
  font-family: 'Segoe UI', sans-serif;
}

/* CARD */
.card {
  border: none;
  border-radius: 14px;
}

/* PAYMENT OPTIONS */
.pay-option {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #eee;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.3s;
}

.pay-option i {
  color: var(--orange);
}

.pay-option:hover {
  background: var(--light);
  border-color: var(--orange);
}

.pay-option.active {
  background: var(--light);
  border-color: var(--orange);
}

/* INPUT ICON STYLE */
.input-group-text {
  background: var(--light);
  border: none;
  color: var(--orange);
}

/* BUTTON */
.pay-btn {
  background: var(--orange);
  border: none;
  color: white;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.3s;
}

.pay-btn:hover {
  background: #e65c00;
}

/* QR BOX */
.qr-box {
  height: 180px;
  border: 2px dashed #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 10px;
}

/* ANIMATION */
.fade-in {
  animation: fade 0.3s ease-in-out;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* ORDER SUMMARY */
.summary-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.total {
  font-weight: bold;
  font-size: 18px;
}

</style>
</head>

<body>

<div class="container mt-5">
  <div class="row g-4">

    <!-- LEFT -->
    <div class="col-md-3">
      <div class="card p-3 shadow-sm">

        <h6 class="fw-bold mb-3">Payment</h6>

        <div class="pay-option active" data-type="card">
          <i class="bi bi-credit-card"></i> Card
        </div>

        <div class="pay-option" data-type="gpay">
          <i class="bi bi-google"></i> GPay
        </div>

        <div class="pay-option" data-type="phonepe">
          <i class="bi bi-phone"></i> PhonePe
        </div>

        <div class="pay-option" data-type="qr">
          <i class="bi bi-qr-code"></i> QR Scan
        </div>

      </div>
    </div>

    <!-- CENTER -->
    <div class="col-md-5">
      <div class="card p-4 shadow-sm">

        <!-- CARD -->
        <div id="cardSection" class="fade-in">

          <h5 class="mb-3">Card Details</h5>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
            <input class="form-control" placeholder="Card Number">
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input class="form-control" placeholder="Name">
          </div>

          <div class="row">
            <div class="col">
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                <input class="form-control" placeholder="MM/YY">
              </div>
            </div>

            <div class="col">
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input class="form-control" placeholder="CVV">
              </div>
            </div>
          </div>

          <button class="btn pay-btn w-100">Pay ₹400</button>

        </div>

        <!-- GPAY -->
        <div id="gpaySection" class="d-none text-center fade-in">
          <i class="bi bi-google fs-1 text-danger"></i>
          <h5 class="mt-3">Pay using Google Pay</h5>
          <p class="text-muted">Complete payment in GPay app</p>
          <button class="btn pay-btn">Open GPay</button>
        </div>

        <!-- PHONEPE -->
        <div id="phonepeSection" class="d-none text-center fade-in">
          <i class="bi bi-phone fs-1 text-primary"></i>
          <h5 class="mt-3">Pay using PhonePe</h5>
          <p class="text-muted">Complete payment in PhonePe app</p>
          <button class="btn pay-btn">Open PhonePe</button>
        </div>

        <!-- QR -->
        <div id="qrSection" class="d-none text-center fade-in">
          <h5>Scan QR to Pay</h5>

          <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=FoodieHubPayment" class="mt-3 rounded shadow">

          <p class="text-muted mt-2">Scan using any UPI app</p>
        </div>

      </div>
    </div>

    <!-- RIGHT SUMMARY -->
    <div class="col-md-4">
      <div class="card p-4 shadow-sm">

        <h6 class="fw-bold mb-3">Order Summary</h6>

        <div class="summary-item">
          <span>Biryani</span>
          <span>₹300</span>
        </div>

        <div class="summary-item">
          <span>Coke</span>
          <span>₹50</span>
        </div>

        <hr>

        <div class="summary-item">
          <span>Delivery</span>
          <span>₹50</span>
        </div>

        <hr>

        <div class="summary-item total">
          <span>Total</span>
          <span>₹400</span>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
const options = document.querySelectorAll('.pay-option');

const sections = {
  card: document.getElementById('cardSection'),
  gpay: document.getElementById('gpaySection'),
  phonepe: document.getElementById('phonepeSection'),
  qr: document.getElementById('qrSection')
};

options.forEach(option => {
  option.addEventListener('click', () => {

    options.forEach(o => o.classList.remove('active'));
    option.classList.add('active');

    Object.values(sections).forEach(sec => sec.classList.add('d-none'));

    const type = option.getAttribute('data-type');
    sections[type].classList.remove('d-none');
  });
});
</script>

</body>
</html>
