<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/das_style.css">
</head>

<body>

<div class="container">

  <div class="content">

    <div class="header">Inventory System</div>

    <div class="card">

      <!-- FORM -->
      <div class="row">

        <div class="col-md-3 position-relative">
          <i class="bi bi-box input-icon"></i>
          <input id="name" class="form-control" placeholder="Item Name">
        </div>

        <div class="col-md-3 position-relative">
          <i class="bi bi-123 input-icon"></i>
          <input id="qty" type="number" class="form-control" placeholder="Quantity">
        </div>

        <div class="col-md-2 position-relative">
          <i class="bi bi-tag input-icon"></i>
          <input id="unit" class="form-control" placeholder="Unit">
        </div>

        <div class="col-md-2">
          <button onclick="addItem()" class="btn btn-orange w-100">
            <i class="bi bi-plus-circle"></i> Add
          </button>
        </div>

        <div class="col-md-2 position-relative">
          <i class="bi bi-search input-icon"></i>
          <input id="search" onkeyup="searchItem()" class="form-control" placeholder="Search">
        </div>

      </div>

    </div>

    <!-- TABLE -->
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="inventoryTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="js/das_script.js"></script>
</body>
</html>
