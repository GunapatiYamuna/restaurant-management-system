    <div class="header">Inventory System</div>

    <div class="card">

      <!-- FORM -->
      <div class="row">

        <div class="col-md-3 position-relative">
          <i class="bi bi-box input-icon"></i>
          <input id="name" class="form-control" placeholder="Item Name">
        </div>

        <div class="col-md-3 position-relative">
          <i class="bi bi-123 input-icon"></i>
          <input id="qty" type="number" class="form-control" placeholder="Quantity">
        </div>

        <div class="col-md-2 position-relative">
          <i class="bi bi-tag input-icon"></i>
          <input id="unit" class="form-control" placeholder="Unit">
        </div>

        <div class="col-md-2">
          <button onclick="addItem()" class="btn btn-orange w-100">
            <i class="bi bi-plus-circle"></i> Add
          </button>
        </div>

        <div class="col-md-2 position-relative">
          <i class="bi bi-search input-icon"></i>
          <input id="search" onkeyup="searchItem()" class="form-control" placeholder="Search">
        </div>

      </div>

    </div>

    <!-- TABLE -->
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Actions</th>
