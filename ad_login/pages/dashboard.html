<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/das_style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="d-flex">

  <!-- Sidebar -->
 <div class="sidebar p-3">
  <h4 class="mb-4">🍽 Restaurant</h4>

  <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="payment.html"><i class="bi bi-credit-card"></i> Payments</a>
  <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
  <a href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
</div>

  <!-- Main Content -->
  <div class="content p-4 w-100">

    <h2>Dashboard</h2>

    <div class="row mt-4">
      <div class="col-md-3"><div class="card p-3 text-center"> <i class="bi bi-bag fs-2 text-primary"></i>    <p>Total Orders</p>  <h4>120</h4>  </div> 
      </div>
      <div class="col-md-3">
       <div class="card p-3 text-center"><i class="bi bi-cash-stack fs-2 text-success"></i><p>Total Revenue</p><h4>$5,000</h4></div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 text-center"><i class="bi bi-people fs-2 text-info"></i><p>Total Customers</p><h4>350</h4></div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 text-center"><i class="bi bi-box-seam fs-2 text-warning"></i><p>Total Items</p><h4>1200</h4></div>
      </div>
    </div>

    <div class="mt-5">
      <h4>Sales Overview</h4>
      <canvas id="salesChart"></canvas>
    </div>

  </div>

</div>
<script>
const ctx = document.getElementById('salesChart');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    datasets: [{
      label: 'Sales',
      data: [5000, 7000, 8000, 6000, 9000, 11000],
      borderWidth: 2,
      tension: 0.4
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        display: true
      }
    }
  }
});
</script>
</body>
</html>
