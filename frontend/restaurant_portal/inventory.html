<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory | Restaurant Portal</title><link rel="stylesheet" href="portal_page.css"></head><body><div class="portal"><aside class="side"><div class="logo">Foodie<span>Hub</span><div class="small">RESTAURANT PORTAL</div></div><nav class="nav"><a href="dashboard.html">▦ Dashboard</a><a href="menu.html">🍽 Menu</a><a href="orders.html">🛍 Orders</a><a href="reservations.html">📅 Reservations</a><a class="active" href="inventory.html">📦 Inventory</a></nav><button id="logout" class="logout">↪ Logout</button></aside><main class="main"><div class="top"><div><h1>Inventory</h1><div class="muted">Track stock and reorder levels</div></div></div><section class="panel"><form class="form" onsubmit="addInventory(event)"><input id="iName" placeholder="Item name" required><input id="iQty" type="number" min="0" step="0.01" placeholder="Quantity" required><input id="iUnit" placeholder="Unit (kg, units...)" value="units"><input id="iReorder" type="number" min="0" step="0.01" placeholder="Reorder level" value="0"><div class="full"><button class="btn orange" type="submit">+ Add inventory item</button></div></form></section><section class="panel tablewrap"><table class="table"><thead><tr><th>Item</th><th>Quantity</th><th>Reorder level</th><th>Health</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><script src="portal.js"></script><script>loadInventory()</script></body></html>
