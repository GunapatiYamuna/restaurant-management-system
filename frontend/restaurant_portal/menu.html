<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu | Restaurant Portal</title><link rel="stylesheet" href="portal_page.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body><div class="portal"><aside class="side"><div class="logo">Foodie<span>Hub</span><div class="small">RESTAURANT PORTAL</div></div><nav class="nav"><a href="dashboard.html">▦ Dashboard</a><a class="active" href="menu.html">🍽 Menu</a><a href="orders.html">🛍 Orders</a><a href="reservations.html">📅 Reservations</a><a href="inventory.html">📦 Inventory</a></nav><button id="logout" class="logout">↪ Logout</button></aside><main class="main"><div class="top"><div><h1>Menu management</h1><div class="muted">Manage only your restaurant's menu</div></div></div><section class="panel"><form class="form" onsubmit="addMenu(event)"><input id="mName" placeholder="Item name" required><input id="mCategory" placeholder="Category"><input id="mPrice" type="number" min="0" step="0.01" placeholder="Price" required><input id="mImage" placeholder="Image path (optional)"><input id="mDescription" class="full" placeholder="Description"><div class="full"><button class="btn orange" type="submit">+ Add menu item</button></div></form></section><section class="panel tablewrap"><table class="table"><thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Availability</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><script src="portal.js"></script><script>loadMenu()</script></body></html>
