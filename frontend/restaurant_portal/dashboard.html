<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Dashboard | FoodieHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="restaurant.css"><style>.portal{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#171717;color:#fff;padding:22px 14px}.side .logo{font-size:22px;font-weight:800;padding:8px 12px 25px}.side .logo span{color:#ff6b00}.nav{display:grid;gap:5px}.nav a{color:#d5d5d5;padding:11px 12px;border-radius:9px}.nav a:hover,.nav a.active{background:#2a2a2a;color:#fff}.nav i{width:24px}.logout{margin-top:30px;border:0;background:transparent;color:#ffb08a;width:100%;text-align:left;padding:11px 12px;font-size:14px}.main{padding:28px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}.top h1{font-size:27px}.restaurant-name{font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:#fff;border:1px solid #e7e9ec;border-radius:14px;padding:20px}.stat small{color:#718096}.stat strong{display:block;font-size:29px;margin-top:7px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:18px}.panel h2{font-size:18px;margin:0}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #eef0f2;text-align:left;font-size:13px}.pill{padding:5px 9px;border-radius:20px;font-size:11px;background:#fff1e8;color:#c94f00}.btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 11px}.btn.orange{background:#ff6b00;color:#fff;border-color:#ff6b00}@media(max-width:900px){.portal{grid-template-columns:1fr}.side{position:relative}.nav{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.main{padding:18px}.stats{grid-template-columns:1fr}.nav{grid-template-columns:1fr}}
</style></head><body><div class="portal"><aside class="side"><div class="logo">Foodie<span>Hub</span><div style="font-size:10px;color:#aaa;letter-spacing:1px;margin-top:4px">RESTAURANT PORTAL</div></div><nav class="nav"><a class="active" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a><a href="menu.html"><i class="bi bi-egg-fried"></i>Menu</a><a href="orders.html"><i class="bi bi-bag-check"></i>Orders</a><a href="reservations.html"><i class="bi bi-calendar-check"></i>Reservations</a><a href="inventory.html"><i class="bi bi-box-seam"></i>Inventory</a></nav><button id="logout" class="logout"><i class="bi bi-box-arrow-left"></i> Logout</button></aside><main class="main"><div class="top"><div><h1>Restaurant dashboard</h1><div class="restaurant-name" id="restaurantName">Loading...</div></div><a class="btn" href="../index.html">View customer site</a></div><div class="stats"><div class="stat"><small>Menu items</small><strong id="menu">—</strong></div><div class="stat"><small>Orders</small><strong id="orders">—</strong></div><div class="stat"><small>Pending orders</small><strong id="pendingOrders">—</strong></div><div class="stat"><small>Reservations</small><strong id="reservations">—</strong></div></div><div class="grid"><section class="panel"><h2>Quick actions</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><a class="btn orange" href="menu.html">Manage menu</a><a class="btn" href="orders.html">View orders</a><a class="btn" href="reservations.html">Reservations</a><a class="btn" href="inventory.html">Inventory</a></div></section><section class="panel"><h2>Account</h2><p class="muted" id="account" style="margin-top:14px"></p></section></div></main></div><script src="portal.js"></script><script>loadDashboard()</script></body></html>
