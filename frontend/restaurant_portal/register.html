<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Registration | FoodieHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="restaurant.css"></head><body class="portal-auth"><main class="auth-card wide"><div class="brand">🍽️ <span>Foodie<span>Hub</span></span></div><p class="eyebrow">RESTAURANT PARTNER PORTAL</p><h1>Register your restaurant account</h1><p class="muted">Choose an existing FoodieHub restaurant and create its management account.</p><div id="alert"></div><form id="registerForm" class="form-grid"><div><label>Your name</label><input id="name" required></div><div><label>Phone</label><input id="phone" inputmode="numeric" maxlength="10" required></div><div><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" minlength="8" required></div><div class="full"><label>Restaurant</label><select id="restaurant" required><option value="">Loading restaurants...</option></select></div><div class="full"><button class="primary" type="submit">Create restaurant account</button></div></form><p class="switch">Already registered? <a href="login.html">Login</a></p><a class="back" href="../index.html">← Back to FoodieHub</a></main><script src="restaurant_auth.js"></script></body></html>
