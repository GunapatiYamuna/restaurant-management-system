<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | FoodieHub</title><link rel="stylesheet" href="css/cart_style.css"><link rel="stylesheet" href="css/footer.css"><link rel="stylesheet" href="css/navbar_auth.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>.tracking{padding:45px 0}.tracking-card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}#trackingMap{height:430px;border-radius:14px;overflow:hidden}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{padding:9px 12px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:700}.step.active{background:#fff1e7;color:#d95500}.driver{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px;background:#fafafa;border-radius:12px;margin-bottom:15px}</style></head><body><nav class="navbar navbar-expand-lg foodie-navbar"><div class="container"><a class="navbar-brand" href="index.html"><i class="bi bi-egg-fried"></i>Foodie<span>Hub</span></a><a class="nav-login" href="user_portal/dashboard.html">My Portal</a></div></nav><main class="container tracking"><div class="tracking-card"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h2 class="fw-bold mb-1">Track Order <span id="orderId"></span></h2><div id="orderMeta" class="text-muted small">Loading...</div></div><a href="user_portal/dashboard.html" class="btn btn-outline-dark">Back to portal</a></div><div class="steps" id="steps"></div><div class="driver" id="driver"><span>Delivery partner not assigned yet.</span></div><div id="trackingMap"></div><p id="mapNote" class="text-muted small mt-2">The map refreshes automatically while your order is active.</p></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const id=new URLSearchParams(location.search).get("id");let map,destination,driverMarker;
const labels=["placed","confirmed","preparing","ready","out_for_delivery","delivered"];
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]))}
async function load(){if(!id){document.getElementById("orderMeta").textContent="Order ID missing.";return}try{const r=await fetch("/api/orders/"+id+"/tracking/",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to load tracking.");const o=d.order;document.getElementById("orderId").textContent="#"+o.id;document.getElementById("orderMeta").textContent="Status: "+o.status+" · Delivery: "+o.address+", "+o.city+" - "+o.pincode;const index=labels.indexOf(o.status);document.getElementById("steps").innerHTML=labels.map((x,i)=>'<span class="step '+(i<=index?'active':'')+'">'+x.replaceAll("_"," ")+'</span>').join("");const driver=document.getElementById("driver");driver.innerHTML=d.partner?'<div><strong>'+esc(d.partner.name)+'</strong><div class="small">'+esc(d.partner.vehicle_type)+' · '+esc(d.partner.phone)+'</div></div><a class="btn btn-sm btn-success" href="tel:'+esc(d.partner.phone)+'">Call</a>':'<span>Waiting for a delivery partner to be assigned.</span>';if(o.delivery_lat&&o.delivery_lng){if(!map){map=L.map("trackingMap").setView([o.delivery_lat,o.delivery_lng],14);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);destination=L.marker([o.delivery_lat,o.delivery_lng]).addTo(map).bindPopup("Delivery location").openPopup()}else destination.setLatLng([o.delivery_lat,o.delivery_lng]);if(d.partner?.current_lat&&d.partner?.current_lng){if(!driverMarker)driverMarker=L.marker([d.partner.current_lat,d.partner.current_lng]).addTo(map).bindPopup("Delivery partner");else driverMarker.setLatLng([d.partner.current_lat,d.partner.current_lng]);map.fitBounds(L.latLngBounds([[o.delivery_lat,o.delivery_lng],[d.partner.current_lat,d.partner.current_lng]]).pad(.2))}}else document.getElementById("mapNote").textContent="No map location was saved for this order.";if(o.status!=="delivered"&&o.status!=="cancelled")setTimeout(load,5000)}catch(e){document.getElementById("orderMeta").textContent=e.message}}load();
</script></body></html>
