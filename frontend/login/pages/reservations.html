<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../../css/footer.css">
<link rel="stylesheet" href="../../css/profile_activity.css">
<title>My Reservations | FoodieHub</title>
</head>
<body data-activity-view="reservations">
{% include "navbar.html" %}
<section class="page-banner">
  <div class="container">
    <h1>My Reservations</h1>
    <p>View all your FoodieHub table reservations.</p>
  </div>
</section>
<main class="container py-4 activity-page">
  <div class="activity-panel">
    <div class="card section-card mb-3">
      <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
        <div>
          <h2 id="activityTitle" class="section-title mb-1"><i class="bi bi-calendar-check me-2"></i>My Reservations</h2>
          <p id="activitySubtitle" class="text-muted mb-0">All table reservations made through your FoodieHub account.</p>
        </div>
        <a class="btn btn-outline-orange activity-back" href="profile.html"><i class="bi bi-arrow-left"></i> Back to Profile</a>
      </div>
    </div>
    <div class="card section-card">
      <div id="activityList"><div class="text-muted">Loading your reservations...</div></div>
    </div>
  </div>
</main>
<div id="footer-placeholder" style="margin-top:50px;"></div>
<script src="../../js/footer.js"></script>
<script src="/js/profile_activity.js"></script>
</body>
</html>
