<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../../css/footer.css">
<title>Login | FoodieHub</title></head>
<body>


<main class="auth-shell">
  <section class="auth-card">
    <div class="brand-mark"><i class="bi bi-person-lock"></i></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Login to your FoodieHub account</p>
    <div id="loginAlert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input id="loginEmail" class="form-control" type="email" placeholder="Enter your email" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input id="loginPassword" class="form-control" type="password" placeholder="Enter your password" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword',this)"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label small-link" for="remember">Remember me</label></div>
        <a class="small-link" href="forgot-password.html">Forgot Password?</a>
      </div>
      <button class="btn btn-orange w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Login</button>
    </form>
    <div class="auth-divider"></div>
    <p class="text-center mb-0" style="font-size:13px">Don't have an account? <a href="register.html">Create Account</a></p>
    
  </section>
</main>


<div id="footer-placeholder" style="margin-top: 50px;"></div>
<script src="../../js/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body></html>
