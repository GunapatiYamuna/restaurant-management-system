<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../../css/footer.css">
<title>Register | FoodieHub</title></head>
<body>


<main class="auth-shell">
  <section class="auth-card wide">
    <div class="brand-mark"><i class="bi bi-person-plus"></i></div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">Join FoodieHub and enjoy easy ordering & reservations</p>
    <div id="registerAlert"></div>
    <form id="registerForm" novalidate>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="fullName">Full Name *</label>
          <input id="fullName" class="form-control" type="text" placeholder="Enter full name" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="registerEmail">Email Address *</label>
          <input id="registerEmail" class="form-control" type="email" placeholder="you@example.com" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="phone">Phone Number *</label>
          <input id="phone" class="form-control" type="tel" maxlength="10" placeholder="10-digit number" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="city">City</label>
          <input id="city" class="form-control" type="text" placeholder="Enter city">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="registerPassword">Password *</label>
          <input id="registerPassword" class="form-control" type="password" placeholder="Create a password" required>
          <div id="registerpasswordMeter" class="password-meter"><span id="registerpasswordMeterFill"></span></div>
          <div class="password-rules">
            <div id="registerlengthRule" class="invalid"><i class="bi bi-circle"></i> At least 8 characters</div>
            <div id="registerupperRule" class="invalid"><i class="bi bi-circle"></i> One uppercase letter</div>
            <div id="registernumberRule" class="invalid"><i class="bi bi-circle"></i> One number</div>
            <div id="registerspecialRule" class="invalid"><i class="bi bi-circle"></i> One special character</div>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="confirmPassword">Confirm Password *</label>
          <input id="confirmPassword" class="form-control" type="password" placeholder="Re-enter password" required>
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label small-link" for="terms">I agree to the Terms & Conditions and Privacy Policy.</label>
      </div>
      <button class="btn btn-orange w-100" type="submit"><i class="bi bi-person-check me-1"></i> Register</button>
    </form>
    <div class="auth-divider"></div>
    <p class="text-center mb-0" style="font-size:13px">Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>


<div id="footer-placeholder" style="margin-top: 50px;"></div>
<script src="../../js/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body></html>
