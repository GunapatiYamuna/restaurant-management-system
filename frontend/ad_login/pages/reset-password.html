<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../../css/footer.css">
<title>Reset Password | FoodieHub</title></head>
<body>
{% include "navbar.html" %}


<main class="auth-shell">
  <section class="auth-card">
    <div class="brand-mark"><i class="bi bi-shield-lock"></i></div>
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">Create a new password for <strong id="resetEmailLabel">your account</strong></p>
    <div id="resetAlert"></div>
    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label" for="resetPassword">New Password</label>
        <input id="resetPassword" class="form-control" type="password" placeholder="Create a strong password" required>
        <div id="resetpasswordMeter" class="password-meter"><span id="resetpasswordMeterFill"></span></div>
        <div class="password-rules">
          <div id="resetlengthRule" class="invalid"><i class="bi bi-circle"></i> At least 8 characters</div>
          <div id="resetupperRule" class="invalid"><i class="bi bi-circle"></i> One uppercase letter</div>
          <div id="resetnumberRule" class="invalid"><i class="bi bi-circle"></i> One number</div>
          <div id="resetspecialRule" class="invalid"><i class="bi bi-circle"></i> One special character</div>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="resetConfirmPassword">Confirm Password</label>
        <input id="resetConfirmPassword" class="form-control" type="password" placeholder="Re-enter new password" required>
      </div>
      <button class="btn btn-orange w-100" type="submit"><i class="bi bi-check2-circle me-1"></i> Reset Password</button>
    </form>
  </section>
</main>
<div id="footer-placeholder"></div>
  <script src="../../js/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body></html>
