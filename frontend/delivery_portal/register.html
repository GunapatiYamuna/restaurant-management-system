<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Partner Registration | FoodieHub</title><link rel="stylesheet" href="delivery.css"></head><body data-google-role="delivery">
{% include "navbar.html" %}
<main class="auth"><section class="hero"><div>Foodie<span style="color:#ff6b00">Hub</span></div><h1>Join the delivery team.</h1><p>Create your partner account and start accepting FoodieHub delivery jobs.</p></section><section class="card"><h2>Create Delivery Account</h2><div id="alert"></div><form id="deliveryRegister" class="form"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" maxlength="10" placeholder="Phone number" required><select id="vehicle_type"><option>Bike</option><option>Scooter</option><option>Car</option><option>Cycle</option></select><input id="vehicle_number" placeholder="Vehicle number"><input id="password" type="password" placeholder="Password" required><button class="primary">Create account</button></form><p class="switch">Already registered? <a href="login.html">Login</a></p></section></main><script src="delivery_auth.js"></script></body></html>
