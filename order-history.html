<!-- =====================================================
                  ORDER HISTORY JAVASCRIPT
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    console.log("Order History page loaded");


    /* Get saved order history */

    const history =
        JSON.parse(
            localStorage.getItem("foodieOrderHistory")
        ) || [];


    console.log("Order History:", history);


    const container =
        document.getElementById(
            "order-history-container"
        );


    /* If there are no orders */

    if (history.length === 0) {

        container.innerHTML = `

            <div
                class="card shadow p-5 text-center">

                <div
                    style="
                        font-size:60px;
                        margin-bottom:20px;
                    ">

                    🛒

                </div>


                <h3 class="fw-bold">

                    No Orders Yet

                </h3>


                <p class="text-muted">

                    You have not placed any orders yet.

                </p>


                <a
                    href="menu.html"
                    class="btn btn-warning mt-3">

                    <i class="bi bi-shop"></i>

                    Browse Menu

                </a>

            </div>

        `;

        return;

    }


    /* Display newest order first */

    history
        .slice()
        .reverse()
        .forEach(function (order, index) {


            const orderCard =
                document.createElement("div");


            orderCard.className =
                "card shadow p-4 mb-4";


            /* Calculate values */

            const items =
                Array.isArray(order.cart)
                ? order.cart
                : [];


            let subtotal = 0;


            items.forEach(function (item) {

                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 1;


                subtotal +=
                    price * quantity;

            });


            const delivery =
                order.delivery !== undefined
                ? Number(order.delivery)
                : (items.length > 0 ? 50 : 0);


            const gst =
                order.gst !== undefined
                ? Number(order.gst)
                : Math.round(subtotal * 0.05);


            const discount =
                order.discount !== undefined
                ? Number(order.discount)
                : 0;


            const total =
                order.total !== undefined
                ? Number(order.total)
                : subtotal +
                  delivery -
                  discount +
                  gst;


            /* Items HTML */

            let itemsHTML = "";


            if (items.length === 0) {

                itemsHTML = `
                    <p class="text-muted">
                        No items found.
                    </p>
                `;

            } else {


                items.forEach(function (item) {


                    const price =
                        Number(item.price) || 0;


                    const quantity =
                        Number(item.quantity) || 1;


                    const itemTotal =
                        price * quantity;


                    itemsHTML += `

                        <div
                            class="d-flex align-items-center justify-content-between mb-3">

                            <div
                                class="d-flex align-items-center">


                                ${
                                    item.image
                                    ?
                                    `
                                    <img
                                        src="${item.image}"
                                        alt="${item.name}"
                                        style="
                                            width:60px;
                                            height:60px;
                                            object-fit:cover;
                                            border-radius:8px;
                                            margin-right:12px;
                                        "
                                    >
                                    `
                                    :
                                    `
                                    <div
                                        style="
                                            width:60px;
                                            height:60px;
                                            border-radius:8px;
                                            background:#f1f1f1;
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            margin-right:12px;
                                        ">

                                        🍽️

                                    </div>
                                    `
                                }


                                <div>

                                    <strong>
                                        ${item.name}
                                    </strong>


                                    <div
                                        class="text-muted">

                                        ₹${price}
                                        ×
                                        ${quantity}

                                    </div>

                                </div>

                            </div>


                            <strong>

                                ₹${itemTotal}

                            </strong>

                        </div>

                    `;

                });

            }


            /* Complete order card */

            orderCard.innerHTML = `

                <!-- Order Header -->

                <div
                    class="d-flex justify-content-between align-items-center flex-wrap mb-3">


                    <div>

                        <h4 class="fw-bold mb-1">

                            <i
                                class="bi bi-receipt text-warning">
                            </i>

                            Order #${order.orderId || "N/A"}

                        </h4>


                        <small
                            class="text-muted">

                            ${order.date || "Date not available"}

                        </small>

                    </div>


                    <span
                        class="badge bg-success p-2">

                        Order Placed

                    </span>


                </div>


                <hr>


                <!-- Payment -->

                <div class="mb-3">

                    <strong>
                        Payment Method:
                    </strong>

                    <span>

                        ${order.payment || "Cash on Delivery"}

                    </span>

                </div>


                <!-- Items -->

                <h5 class="fw-bold mb-3">

                    <i class="bi bi-bag-check text-warning"></i>

                    Ordered Items

                </h5>


                ${itemsHTML}


                <hr>


                <!-- Bill -->

                <div
                    class="d-flex justify-content-between mb-2">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹${subtotal}
                    </strong>

                </div>


                <div
                    class="d-flex justify-content-between mb-2">

                    <span>
                        Delivery Fee
                    </span>

                    <strong>
                        ₹${delivery}
                    </strong>

                </div>


                <div
                    class="d-flex justify-content-between mb-2">

                    <span>
                        Discount
                    </span>

                    <strong>
                        -₹${discount}
                    </strong>

                </div>


                <div
                    class="d-flex justify-content-between mb-2">

                    <span>
                        GST
                    </span>

                    <strong>
                        ₹${gst}
                    </strong>

                </div>


                <hr>


                <div
                    class="d-flex justify-content-between">


                    <strong class="fs-5">

                        Total

                    </strong>


                    <strong
                        class="fs-5 text-success">

                        ₹${total}

                    </strong>


                </div>


                <!-- Buttons -->

                <div class="mt-4">


                    <a
                        href="menu.html"
                        class="btn btn-warning">

                        <i class="bi bi-shop"></i>

                        Order Again

                    </a>


                    <a
                        href="index.html"
                        class="btn btn-outline-dark ms-2">

                        <i class="bi bi-house"></i>

                        Home

                    </a>


                </div>

            `;


            container.appendChild(orderCard);

        });


});

</script>
