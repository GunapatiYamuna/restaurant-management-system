<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../../css/footer.css">
<title>Forgot Password | FoodieHub</title></head>
<body>


<main class="auth-shell">
  <section class="auth-card">
    <div class="brand-mark"><i class="bi bi-key"></i></div>
    <h1 class="auth-title">Forgot Password?</h1>
    <p class="auth-subtitle">Enter your registered email to reset your password</p>
    <div id="forgotAlert"></div>
    <form id="forgotForm">
      <div class="mb-4">
        <label class="form-label" for="forgotEmail">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input id="forgotEmail" class="form-control" type="email" placeholder="Enter your email" required>
        </div>
      </div>
      <button class="btn btn-orange w-100" type="submit"><i class="bi bi-send me-1"></i> Send Reset Link</button>
    </form>
    <div class="auth-divider"></div>
    <p class="text-center mb-0"><a href="login.html"><i class="bi bi-arrow-left me-1"></i> Back to Login</a></p>
  </section>
</main>


<div id="footer-placeholder" style="margin-top: 50px;"></div>
<script src="../../js/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body></html>
